<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1200px; height:630px; overflow:hidden; font-family:'Gothic A1',system-ui,sans-serif;
    background:
      radial-gradient(120% 95% at 80% 12%, rgba(255,206,120,.30), rgba(180,120,40,.10) 34%, rgba(0,0,0,0) 70%),
      linear-gradient(135deg,#3a2613,#241608 50%,#0d0703);
    position:relative; }
  body::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.65)); }

  /* flare */
  .flare{ position:absolute; left:80%; top:14%; width:1px; height:1px; }
  .flare .bloom{ position:absolute; left:50%; top:50%; width:265px; height:265px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,200,.9), rgba(255,210,130,.4) 28%, rgba(255,180,80,0) 70%); }
  .flare .ray{ position:absolute; left:50%; top:50%; transform-origin:center;
    background:linear-gradient(90deg, rgba(255,235,180,0), rgba(255,245,210,.95) 50%, rgba(255,235,180,0)); }
  .flare .r1{ width:315px; height:4px; transform:translate(-50%,-50%); }
  .flare .r2{ width:4px; height:214px; transform:translate(-50%,-50%); }
  .flare .r3{ width:151px; height:3px; transform:translate(-50%,-50%) rotate(45deg); }
  .flare .r4{ width:151px; height:3px; transform:translate(-50%,-50%) rotate(-45deg); }

  .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:34px; z-index:1; }
  .head{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .label{ display:inline-flex; align-items:center; gap:26px;
    font-family:'Gothic A1'; font-weight:800; font-size:25px; letter-spacing:.14em;
    color:#f0d49a; text-shadow:0 0 18px rgba(255,200,120,.55); }
  .label .ln{ width:168px; height:2px; }
  .label .ln.l{ background:linear-gradient(90deg, rgba(233,193,120,0), rgba(233,193,120,.9)); }
  .label .ln.r{ background:linear-gradient(90deg, rgba(233,193,120,.9), rgba(233,193,120,0)); }
  .title{ font-family:'Black Han Sans'; font-size:120px; line-height:1; letter-spacing:.01em;
    background:linear-gradient(180deg,#fffdf6,#fff1d2 55%,#f2cd86);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 2px rgba(0,0,0,.25)) drop-shadow(0 0 30px rgba(255,196,96,.55)); }

  /* odometer board: 10,000,000 */
  .board{ display:flex; align-items:center; gap:7px;
    padding:22px 26px;
    background:linear-gradient(180deg,#1b1610,#070504);
    border:3px solid rgba(233,193,120,.4); border-radius:25px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.6), 0 0 50px rgba(255,196,96,.35); }
  .cell{ position:relative; width:88px; height:128px; overflow:hidden;
    border-radius:15px; border:1px solid rgba(233,193,120,.18);
    background:linear-gradient(180deg,#211c16,#0e0b08 49%,#080605 51%,#020201);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; }
  .cell span{ font-family:'Oswald'; font-weight:700; font-size:90px; color:#fbf7ee;
    text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .cell::before{ content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,250,235,.08), rgba(0,0,0,0) 46%, rgba(0,0,0,.42) 50%, rgba(0,0,0,.10) 54%, rgba(0,0,0,.30)); }
  .cell::after{ content:''; position:absolute; left:0; right:0; top:50%; height:2px; transform:translateY(-1px);
    z-index:3; pointer-events:none; background:rgba(0,0,0,.8); box-shadow:0 1.5px 0 rgba(255,235,180,.06); }
  .comma{ font-family:'Oswald'; font-weight:700; font-size:90px; color:#e9c178;
    width:37px; text-align:center; align-self:flex-end; padding-bottom:18px;
    text-shadow:0 0 10px rgba(255,200,120,.5); }
</style>
</head>
<body>
  <div class="flare"><div class="bloom"></div><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="ray r4"></div></div>
  <div class="center">
    <div class="head">
      <div class="label"><span class="ln l"></span><span>누적 판매량 카운터</span><span class="ln r"></span></div>
      <div class="title">1,000만잔</div>
    </div>
    <div class="board">
      <div class="cell"><span>1</span></div><div class="cell"><span>0</span></div><div class="comma">,</div>
      <div class="cell"><span>0</span></div><div class="cell"><span>0</span></div><div class="cell"><span>0</span></div><div class="comma">,</div>
      <div class="cell"><span>0</span></div><div class="cell"><span>0</span></div><div class="cell"><span>0</span></div>
    </div>
  </div>
</body>
</html>
