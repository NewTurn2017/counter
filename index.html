<style>
  :root{ --gold:#e9c178; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; font-family:'Gothic A1',system-ui,sans-serif; }

  /* ---- stage (fixed-aspect, scaled to fit; OBS captures this) ---- */
  #stage{
    position:absolute; left:50%; top:50%; transform-origin:center;
    width:var(--DW); height:var(--DH); border-radius:4px; overflow:hidden;
    background:
      radial-gradient(120% 95% at 80% 12%, rgba(255,206,120,.30), rgba(180,120,40,.10) 34%, rgba(0,0,0,0) 70%),
      linear-gradient(135deg,#3a2613,#241608 50%,#0d0703);
    cursor:pointer; user-select:none;
  }
  #stage::after{ /* vignette */
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.65));
  }
  #stage.bg-black{ background:#000 !important; }
  #stage.bg-green{ background:#00b140 !important; }
  #stage.bg-green::after{ display:none; }
  #stage.bg-green .flare,#stage.bg-green .sparks{ display:none; }

  /* ---- flare (upper-right star) ---- */
  .flare{ position:absolute; left:80%; top:14%; width:1px; height:1px; pointer-events:none; }
  .flare .bloom{ position:absolute; left:50%; top:50%; width:calc(var(--DH)*0.42); height:calc(var(--DH)*0.42);
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,200,.9), rgba(255,210,130,.4) 28%, rgba(255,180,80,0) 70%);
    animation:tw 3.4s ease-in-out infinite; }
  .flare .ray{ position:absolute; left:50%; top:50%; transform-origin:center;
    background:linear-gradient(90deg, rgba(255,235,180,0), rgba(255,245,210,.95) 50%, rgba(255,235,180,0));
    animation:tw 3.4s ease-in-out infinite; }
  .flare .r1{ width:calc(var(--DH)*0.5); height:4px; transform:translate(-50%,-50%); }
  .flare .r2{ width:4px; height:calc(var(--DH)*0.34); transform:translate(-50%,-50%); }
  .flare .r3{ width:calc(var(--DH)*0.24); height:3px; transform:translate(-50%,-50%) rotate(45deg); }
  .flare .r4{ width:calc(var(--DH)*0.24); height:3px; transform:translate(-50%,-50%) rotate(-45deg); }
  @keyframes tw{ 0%,100%{ opacity:.8; } 50%{ opacity:1; } }

  /* ---- sparks (cheap CSS dots) ---- */
  .sparks{ position:absolute; inset:0; pointer-events:none; }
  .sparks i{ position:absolute; bottom:18%; width:3px; height:3px; border-radius:50%;
    background:#ffce82; box-shadow:0 0 6px 1px rgba(255,190,90,.8); opacity:0;
    animation:rise var(--d) linear infinite; animation-delay:var(--dl); }
  @keyframes rise{ 0%{ transform:translate(0,0) scale(.6); opacity:0; }
    10%{ opacity:1; } 100%{ transform:translate(var(--mx), calc(var(--DH)*-0.32)) scale(0); opacity:0; } }

  /* ---- centered layout (fits any aspect) ---- */
  .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:var(--vgap); padding:0 var(--gap); }
  .head{ display:flex; flex-direction:column; align-items:center; gap:var(--headGap); }
  .label{ display:inline-flex; align-items:center; gap:calc(var(--DW)*0.022);
    font-family:'Gothic A1'; font-weight:800; font-size:var(--labelF); letter-spacing:.14em;
    color:#f0d49a; text-shadow:0 0 18px rgba(255,200,120,.55); }
  .label .ln{ width:calc(var(--DW)*0.14); height:2px; }
  .label .ln.l{ background:linear-gradient(90deg, rgba(233,193,120,0), rgba(233,193,120,.9)); }
  .label .ln.r{ background:linear-gradient(90deg, rgba(233,193,120,.9), rgba(233,193,120,0)); }
  .title{ font-family:'Black Han Sans'; font-size:var(--titleF);
    line-height:1; letter-spacing:.01em;
    background:linear-gradient(180deg,#fffdf6,#fff1d2 55%,#f2cd86);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 2px rgba(0,0,0,.25)) drop-shadow(0 0 30px rgba(255,196,96,.55));
    transition:transform .4s cubic-bezier(.2,1.4,.4,1); }
  #stage.done .title{ transform:scale(1.04); }

  /* ---- odometer board ---- */
  .board{ display:flex; align-items:center; gap:var(--gap); max-width:100%;
    padding:calc(var(--cellH)*0.16) calc(var(--cellW)*0.24);
    background:linear-gradient(180deg,#1b1610,#070504);
    border:3px solid rgba(233,193,120,.4); border-radius:calc(var(--cellH)*0.18);
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.6);
    transition:box-shadow .5s ease; }
  #stage.done .board{ box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.6), 0 0 50px rgba(255,196,96,.35); }
  .cell{ position:relative; width:var(--cellW); height:var(--cellH); overflow:hidden;
    border-radius:var(--cr); border:1px solid rgba(233,193,120,.18);
    background:linear-gradient(180deg,#211c16,#0e0b08 49%,#080605 51%,#020201);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.55); }
  .cell .reel{ position:absolute; left:0; right:0; top:0; will-change:transform; }
  .cell .reel span{ display:block; height:var(--cellH); line-height:var(--cellH); text-align:center;
    font-family:'Oswald'; font-weight:700; font-size:var(--digitF); color:#fbf7ee;
    text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .cell::before{ content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,250,235,.08), rgba(0,0,0,0) 46%, rgba(0,0,0,.42) 50%, rgba(0,0,0,.10) 54%, rgba(0,0,0,.30)); }
  .cell::after{ content:''; position:absolute; left:0; right:0; top:50%; height:2px; transform:translateY(-1px);
    z-index:3; pointer-events:none; background:rgba(0,0,0,.8); box-shadow:0 1.5px 0 rgba(255,235,180,.06); }
  .comma{ font-family:'Oswald'; font-weight:700; font-size:var(--digitF); color:#e9c178;
    width:var(--commaW); text-align:center; align-self:flex-end; padding-bottom:calc(var(--cellH)*0.14);
    text-shadow:0 0 10px rgba(255,200,120,.5); }

  /* ---- control bar ---- */
  #bar{ position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center;
    padding:12px 16px; background:linear-gradient(180deg,rgba(12,9,6,.35),rgba(12,9,6,.94));
    backdrop-filter:blur(10px); border-top:1px solid rgba(233,193,120,.18); color:#f3e6cf; }
  #bar.hidden{ display:none; }
  .grp{ display:flex; align-items:center; gap:8px; }
  .lab{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#a78b5e; font-weight:700; }
  input[type=text]{ width:120px; } input[type=text].s{ width:80px; }
  input[type=text],select{ background:#17120b; color:#f3e6cf; border:1px solid rgba(233,193,120,.25);
    border-radius:8px; padding:7px 10px; font-family:inherit; font-size:13px; outline:none; }
  input[type=text]:focus,select:focus{ border-color:var(--gold); }
  input[type=range]{ width:120px; accent-color:var(--gold); }
  .num{ color:var(--gold); font-weight:800; min-width:42px; font-size:13px; }
  label.chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:#d8c39a; cursor:pointer; }
  button{ font-family:inherit; font-weight:800; letter-spacing:.04em; cursor:pointer; border:none; border-radius:9px; padding:9px 16px; font-size:13px; transition:.15s; }
  .b-play{ background:linear-gradient(180deg,#f1d79a,#cf9f4f); color:#2a1d08; }
  .b-play:hover{ filter:brightness(1.07); }
  .b-ghost{ background:#17120b; color:#d8c39a; border:1px solid rgba(233,193,120,.25); }
  #tip{ position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:30; font-size:12px;
    color:#b89a66; background:rgba(12,9,6,.6); padding:6px 14px; border-radius:20px; border:1px solid rgba(233,193,120,.15); }
  #tip.hidden{ display:none; }
  @media (max-width:780px){ .hide-sm{ display:none; } input[type=text]{ width:96px; } }
</style>
</head>
<body>
  <div id="tip">H 키: UI 숨기기 · 화면을 OBS로 캡처하세요 · 클릭하면 다시재생</div>

  <div id="stage" class="bg-scene">
    <div class="flare"><div class="bloom"></div><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="ray r4"></div></div>
    <div class="sparks" id="sparks"></div>
    <div class="center">
      <div class="head">
        <div class="label"><span class="ln l"></span><span id="labelTxt">누적 판매량</span><span class="ln r"></span></div>
        <div class="title" id="titleEl">0만잔</div>
      </div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div id="bar">
    <div class="grp"><span class="lab">목표</span>
      <input id="iTarget" type="text" value="10,000,000" inputmode="numeric"></div>
    <div class="grp"><span class="lab hide-sm">라벨</span>
      <input id="iLabel" type="text" value="누적 판매량"></div>
    <div class="grp"><span class="lab hide-sm">타이틀</span>
      <select id="iUnit" title="숫자를 나눌 단위">
        <option value="1">일</option>
        <option value="10">십</option>
        <option value="100">백</option>
        <option value="1000">천</option>
        <option value="10000" selected>만</option>
        <option value="100000000">억</option>
      </select>
      <input id="iTitle" type="text" class="s" value="만잔" title="숫자 뒤에 붙는 글자"></div>
    <div class="grp"><span class="lab">길이</span>
      <input id="iDur" type="range" min="2" max="12" step="0.5" value="5"><span class="num" id="durOut">5.0s</span></div>
    <div class="grp"><span class="lab hide-sm">비율</span>
      <select id="iAsp"><option value="16:9">16:9</option><option value="9:16">9:16 (세로)</option><option value="1:1">1:1</option><option value="4:3">4:3</option></select></div>
    <div class="grp"><span class="lab">배경</span>
      <select id="iBg"><option value="scene">골드 씬</option><option value="black">검정(Screen)</option><option value="green">크로마 그린</option></select></div>
    <label class="chk"><input type="checkbox" id="iLoop"> 반복</label>
    <button class="b-play" id="bPlay">↻ 다시재생</button>
    <button class="b-ghost" id="bHide">UI 숨김 (H)</button>
  </div>

<script>
const stage=document.getElementById('stage');
const board=document.getElementById('board');
const titleEl=document.getElementById('titleEl');
const cfg={ dur:5 };
let targetNum=10000000, digits=8, commaCount=2, titleUnit=10000, titleSuffix='만잔', asp='16:9';
let reels=[], prevVP=[];

// ---- build the odometer board for the current target (digits + commas) ----
function digitsOf(n){ return Math.max(1, String(Math.floor(n)).length); }
function buildBoard(){
  digits = digitsOf(targetNum);
  commaCount = Math.floor((digits-1)/3);
  board.innerHTML=''; reels=[];
  for(let i=0;i<digits;i++){
    const cell=document.createElement('div'); cell.className='cell';
    const reel=document.createElement('div'); reel.className='reel';
    for(let d=0; d<=10; d++){ const s=document.createElement('span'); s.textContent=d%10; reel.appendChild(s); }
    cell.appendChild(reel); board.appendChild(cell); reels.push(reel);
    if(i<digits-1 && (digits-1-i)%3===0){ const c=document.createElement('div'); c.className='comma'; c.textContent=','; board.appendChild(c); }
  }
  prevVP=new Array(digits).fill(0);
}

// ---- sparks ----
(function(){
  const wrap=document.getElementById('sparks'); const n=22;
  for(let k=0;k<n;k++){
    const s=document.createElement('i');
    const left = (Math.random()<0.5) ? (4+Math.random()*16) : (80+Math.random()*16); // bottom corners
    s.style.left=left+'%';
    s.style.setProperty('--d',(2.4+Math.random()*2.6)+'s');
    s.style.setProperty('--dl',(-Math.random()*4)+'s');
    s.style.setProperty('--mx',((Math.random()*2-1)*60)+'px');
    wrap.appendChild(s);
  }
})();

// ---- sizing / scale to fit ----
const ASP={ '16:9':[1280,720], '9:16':[720,1280], '1:1':[1000,1000], '4:3':[1000,750] };
let DW=1280,DH=720,cellH=170;
function setSizes(a){
  asp=a||asp;
  [DW,DH]=ASP[asp]||ASP['16:9'];
  const gap=Math.round(DW*0.006);
  const items=digits+commaCount;
  // fit (digits cells + commas + gaps + padding) into ~88% of stage width
  let cellW=Math.round((DW*0.88 - (items-1)*gap) / (digits + 0.42*commaCount + 0.44));
  cellW=Math.max(8, cellW);
  cellH=Math.round(Math.min(cellW*1.5, DH*0.24));
  if(cellW > cellH*0.95) cellW=Math.round(cellH*0.95);   // keep nice proportions for few digits
  const commaW=Math.round(cellW*0.42);
  const v={
    '--DW':DW+'px','--DH':DH+'px',
    '--cellH':cellH+'px','--cellW':cellW+'px',
    '--gap':gap+'px','--commaW':commaW+'px',
    '--digitF':Math.round(cellH*0.7)+'px',
    '--titleF':Math.round(Math.min(DH*0.15, DW*0.12))+'px',
    '--labelF':Math.round(Math.min(DH*0.04, DW*0.035))+'px',
    '--vgap':Math.round(DH*0.055)+'px',
    '--headGap':Math.round(DH*0.018)+'px',
    '--cr':Math.round(cellH*0.12)+'px',
  };
  for(const k in v) stage.style.setProperty(k,v[k]);
  fit();
}
function fit(){
  const barH = document.getElementById('bar').classList.contains('hidden') ? 16 : 84;
  const s=Math.min((window.innerWidth-24)/DW, (window.innerHeight-barH-16)/DH);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);

// ---- animation (GPU transforms only) ----
const W=0.9, sm=t=>t*t*(3-2*t);
function ease(p){ return p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; } // easeInOutCubic
let startT=0, lastTitle='', rafId=0;

function fmtTitle(v){
  return Math.floor(v/titleUnit).toLocaleString() + titleSuffix;
}
function reset(){ startT=0; lastTitle=''; if(prevVP) prevVP.fill(0); stage.classList.remove('done'); }

function frame(now){
  if(!startT) startT=now;
  const t=(now-startT)/1000, dur=cfg.dur;
  const p=Math.min(1, t/dur);
  const value = p>=1 ? targetNum : targetNum*ease(p);
  const der = p>=1 ? 0 : (p<0.5 ? 12*p*p : 12*(1-p)*(1-p)); // easeInOutCubic'
  const vspeed = targetNum*der/dur;              // units/sec (frame-rate independent)

  const ttl=fmtTitle(value);
  if(ttl!==lastTitle){ titleEl.textContent=ttl; lastTitle=ttl; }

  for(let i=0;i<digits;i++){
    const P=Math.pow(10, digits-1-i);
    const vP=value/P;
    const idx=Math.floor(vP), digit=((idx%10)+10)%10;
    const dist=(idx+1)*P - value;
    let rT = dist<W ? sm((W-dist)/W) : 0;
    const gated=digit+rT, cont=vP%10;
    const cpf=(vspeed/P)/60;                       // cells/frame (analytic)
    const used = cpf>0.34 ? cont : gated;          // fast: smooth scroll, slow: synced lock
    reels[i].style.transform=`translate3d(0,${(-used*cellH).toFixed(2)}px,0)`;
  }

  if(p>=1) stage.classList.add('done');

  if(p>=1 && document.getElementById('iLoop').checked && t>dur+1.3){ reset(); }
  rafId=requestAnimationFrame(frame);
}
function play(){ reset(); cancelAnimationFrame(rafId); rafId=requestAnimationFrame(frame); }

// rebuild board for a new target, then resize + replay
function applyTarget(){
  buildBoard();
  setSizes(asp);
  play();
}

// ---- UI ----
const bar=document.getElementById('bar'), tip=document.getElementById('tip');
document.getElementById('iLabel').oninput=e=>document.getElementById('labelTxt').textContent=e.target.value;
document.getElementById('iTitle').oninput=e=>{ titleSuffix=e.target.value; titleEl.textContent=fmtTitle(0); preloadTitleFont(); };
document.getElementById('iUnit').onchange=e=>{ titleUnit=parseInt(e.target.value,10); titleEl.textContent=fmtTitle(0); };
const iTarget=document.getElementById('iTarget');
function commitTarget(){
  const n=parseInt((iTarget.value||'').replace(/[^\d]/g,''),10);
  targetNum = (isFinite(n)&&n>=1) ? Math.min(n, 999999999999) : 1;
  iTarget.value = targetNum.toLocaleString();
  applyTarget();
}
iTarget.onchange=commitTarget;
iTarget.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); commitTarget(); iTarget.blur(); } });
document.getElementById('iDur').oninput=e=>{ cfg.dur=parseFloat(e.target.value); document.getElementById('durOut').textContent=cfg.dur.toFixed(1)+'s'; };
document.getElementById('iAsp').onchange=e=>setSizes(e.target.value);
document.getElementById('iBg').onchange=e=>{ stage.className='bg-'+e.target.value; };
document.getElementById('bPlay').onclick=play;
stage.onclick=play;
function toggleUI(){ const h=bar.classList.toggle('hidden'); tip.classList.toggle('hidden',h); fit(); }
document.getElementById('bHide').onclick=toggleUI;
window.addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H') toggleUI(); if(e.code==='Space'){ e.preventDefault(); play(); } });

// ---- boot ----
function preloadTitleFont(){
  // Black Han Sans is split into unicode-range subsets; preload the glyphs the title actually uses
  try{ document.fonts.load("400 100px 'Black Han Sans'","0123456789,"+titleSuffix); }catch(e){}
}
async function boot(){
  buildBoard();
  setSizes('16:9');
  try{ await Promise.all([
    document.fonts.load("400 100px 'Black Han Sans'","0123456789,"+titleSuffix+" 누적 판매량"),
    document.fonts.load("700 100px 'Oswald'","0123456789,"),
    document.fonts.load("800 40px 'Gothic A1'","누적 판매량"),
  ]); }catch(e){}
  setSizes(asp);
  setTimeout(play, 250);
}
boot();
</script>
</body>
</html>
